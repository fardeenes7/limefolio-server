version: "3.8"

services:
    server:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: limefolio-server
        restart: unless-stopped
        volumes:
            - ./:/app
        ports:
            - "127.0.0.1:8001:8000"
        env_file:
            - .env
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER:-limefolio}:${POSTGRES_PASSWORD:-limefolio}@db:5432/${POSTGRES_DB:-limefolio}
            - SECRET_KEY=${SECRET_KEY}
            - DEBUG=${DEBUG:-False}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,.vercel.app}
            - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
            - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL}
            - AWS_S3_CUSTOM_DOMAIN=${AWS_S3_CUSTOM_DOMAIN}
            - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-auto}
            - AWS_QUERYSTRING_AUTH=${AWS_QUERYSTRING_AUTH:-False}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
            - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
            - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
            - EMAIL_HOST=${EMAIL_HOST}
            - EMAIL_PORT=${EMAIL_PORT:-587}
            - EMAIL_USE_TLS=${EMAIL_USE_TLS}
            - EMAIL_HOST_USER=${EMAIL_HOST_USER}
            - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
            - FRONTEND_URL=${FRONTEND_URL}
            - SITE_ID=${SITE_ID:-1}
            - REVALIDATION_TOKEN=${REVALIDATION_TOKEN}
            - PUBLIC_APP_DOMAIN=${PUBLIC_APP_DOMAIN:-limefolio.com}
            - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://public.limefolio.com}
            - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
            - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}
        depends_on:
            - db
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    db:
        image: postgres:16
        container_name: limefolio-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-limefolio}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-limefolio}
            POSTGRES_DB: ${POSTGRES_DB:-limefolio}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-limefolio} -d ${POSTGRES_DB:-limefolio}"
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
