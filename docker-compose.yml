version: "3.8"

services:
    server:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: limefolio-server
        restart: unless-stopped
        ports:
            - "8001:8000"
        env_file:
            - .env
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER:-limefolio}:${POSTGRES_PASSWORD:-limefolio}@db:5432/${POSTGRES_DB:-limefolio}
            - SECRET_KEY=${SECRET_KEY}
            - DEBUG=${DEBUG:-False}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,.vercel.app}
            - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
            - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL}
            - AWS_S3_CUSTOM_DOMAIN=${AWS_S3_CUSTOM_DOMAIN}
            - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME}
            - AWS_QUERYSTRING_AUTH=${AWS_QUERYSTRING_AUTH}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
            - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
            - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
            - EMAIL_HOST=${EMAIL_HOST}
            - EMAIL_PORT=${EMAIL_PORT}
            - EMAIL_USE_TLS=${EMAIL_USE_TLS}
            - EMAIL_HOST_USER=${EMAIL_HOST_USER}
            - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
            - FRONTEND_URL=${FRONTEND_URL}
            - SITE_ID=${SITE_ID:-1}
            - REVALIDATION_TOKEN=${REVALIDATION_TOKEN}
            - PUBLIC_APP_DOMAIN=${PUBLIC_APP_DOMAIN:-limefolio.com}
            - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://public.limefolio.com}
        depends_on:
            - db

    db:
        image: postgres:15-alpine
        container_name: limefolio-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-limefolio}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-limefolio}
            POSTGRES_DB: ${POSTGRES_DB:-limefolio}
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
